<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGuard — Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #2c3e50; }
        .login-card { max-width: 380px; margin: 8% auto; }
        .brand { color: #ecf0f1; text-align: center; margin-bottom: 1.5rem; }
        .btn-skyguard { background-color: #3498db; border-color: #3498db; color: #fff; }
        .btn-skyguard:hover { background-color: #2980b9; border-color: #2980b9; color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <h3><i class="fas fa-shield-alt"></i> SkyGuard</h3>
            <small class="text-muted">Raptor Alert System</small>
        </div>
        <div class="card">
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
                {% endif %}
                <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-skyguard w-100">
                        <i class="fas fa-sign-in-alt"></i> Sign in
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
